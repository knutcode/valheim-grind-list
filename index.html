<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valheim Grind List</title>
<meta name="description" content="Valheim grind trackers for Knut and Kage">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x2694;&#xFE0F;</text></svg>">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header>
  <h1>&#x2694;&#xFE0F; Valheim Grind List</h1>
  <div class="subtitle">Pick your list</div>
</header>

<div class="pick">
  <a href="/knut">
    <div class="who">Knut</div>
    <div class="goal">Mistwalker + Feather Cape (+ Carapace Helmet)</div>
    <div class="mini">
      <div class="progress-track"><div class="progress-fill" id="knutFill"></div></div>
      <span class="pct" id="knutPct">0 / 0</span>
    </div>
  </a>
  <a href="/kage">
    <div class="who">Kage</div>
    <div class="goal">Full Eitr-weave set (+ BM axe, root chest, arrows)</div>
    <div class="mini">
      <div class="progress-track"><div class="progress-fill" id="kageFill"></div></div>
      <span class="pct" id="kagePct">0 / 0</span>
    </div>
  </a>
</div>

<footer>Progress is saved per browser (localStorage)</footer>

<script src="/assets/data-knut.js"></script>
<script>window.KNUT_DATA = window.GRIND_DATA;</script>
<script src="/assets/data-kage.js"></script>
<script>window.KAGE_DATA = window.GRIND_DATA;</script>
<script>
(function () {
  function summarise(data, key, fillId, pctId) {
    let state = {};
    try { state = JSON.parse(localStorage.getItem(key)) || {}; } catch (e) { state = {}; }
    let total = 0, done = 0;
    data.forEach((step, si) => {
      step.items.forEach((_, ii) => {
        total++;
        if (state[si + "-" + ii]) done++;
      });
    });
    document.getElementById(pctId).textContent = done + " / " + total;
    document.getElementById(fillId).style.width = (total ? (done / total) * 100 : 0) + "%";
  }
  summarise(window.KNUT_DATA, "valheim-grind-v1", "knutFill", "knutPct");
  summarise(window.KAGE_DATA, "valheim-grind-kage-v1", "kageFill", "kagePct");
})();
</script>
</body>
</html>
